<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>구피 도감 키우기</title>
  <link rel="stylesheet" href="style.css?v=14" />
</head>
<body>
  <!-- 시작 타이틀 화면 -->
  <div id="start-screen" class="screen">
    <div class="pixel-box title-box">
      <h1>GUPPY TANK</h1>
      <p>구피를 돌보고 14종의 도감을 채우세요</p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button id="btn-continue" class="pixel-btn primary hidden">CONTINUE</button>
        <button id="btn-start" class="pixel-btn">NEW GAME</button>
      </div>
    </div>
  </div>

  <!-- 메인 게임 화면 -->
  <div id="game-screen" class="screen hidden">
    <header class="top-bar pixel-box">
      <div class="time-group">
        <span id="game-day">1일차</span>
        <span id="game-clock">9시 00분</span>
        <div class="time-controls">
          <button id="btn-sound" class="mini-btn">소리:켬</button>
          <button id="btn-pause" class="mini-btn">정지</button>
          <button id="btn-speed" class="mini-btn">1배속</button>
        </div>
      </div>
      <div class="status-group">
        <span id="stat-water" class="badge">수질:좋음</span>
        <span id="stat-moss" class="badge">이끼:없음</span>
        <span id="stat-food" class="badge">사료:0/6</span>
        <span id="stat-babybox" class="badge hidden">새끼장:보유</span>
        <span id="stat-treat" class="badge gold hidden">특식효과</span>
        <span id="stat-parasite" class="badge warn hidden">기생충</span>
        <span id="stat-overcrowd" class="badge warn hidden">과포화</span>
        <span id="stat-count" class="badge">성체:2 새끼:0</span>
        <span id="stat-gold" class="badge gold">10G</span>
      </div>
    </header>

    <main class="tank-area">
      <div class="tank-wrapper pixel-box">
        <canvas id="tank-canvas"></canvas>
        <div id="action-overlay" class="overlay hidden">청소 중...</div>
      </div>
    </main>

    <div id="log-bar" class="pixel-box">구피나 공기방울을 터치하면 1G를 얻을 수 있습니다!</div>

    <footer class="bottom-bar">
      <button id="btn-water" class="pixel-btn">물 갈기 <small>(-5G)</small></button>
      <button id="btn-wall" class="pixel-btn">벽 닦기 <small>(-3G)</small></button>
      <button id="btn-clean-all" class="pixel-btn">전체청소 <small>(-15G)</small></button>
      <button id="btn-feed" class="pixel-btn feed">밥 주기 <small>(-1G)</small></button>
      <button id="btn-dex" class="pixel-btn dex">도감 <small>(1/14)</small></button>
      <button id="btn-shop" class="pixel-btn shop">상점</button>
    </footer>
  </div>

  <!-- 도감 모달 -->
  <div id="dex-modal" class="modal hidden">
    <div class="pixel-box modal-content wide">
      <div class="modal-header">
        <h2>물고기 도감 (<span id="dex-progress">1/14</span>)</h2>
        <button id="btn-close-dex" class="mini-btn">닫기</button>
      </div>
      <div id="dex-grid" class="dex-grid"></div>
    </div>
  </div>

  <!-- 상점 및 분양 모달 -->
  <div id="shop-modal" class="modal hidden">
    <div class="pixel-box modal-content wide">
      <div class="modal-header">
        <h2>상점 / 분양 (<span id="shop-gold">10G</span>)</h2>
        <button id="btn-close-shop" class="mini-btn">닫기</button>
      </div>
      <p class="sub-text">상점을 여는 동안 시간이 멈춥니다. (장식 2개 / 바닥재 1개)</p>
      <div id="shop-list" class="shop-list"></div>
    </div>
  </div>

  <!-- 밤 정산 모달 -->
  <div id="night-modal" class="modal hidden">
    <div class="pixel-box modal-content">
      <h2>NIGHT REPORT</h2>
      <p class="sub-text">오후 5시가 되어 어항의 불이 꺼졌습니다.</p>
      <div id="night-report" class="report-box"></div>
      <button id="btn-next-day" class="pixel-btn primary">다음 날 (9시 00분)</button>
    </div>
  </div>

  <!-- 게임 오버 모달 -->
  <div id="gameover-modal" class="modal hidden">
    <div class="pixel-box modal-content">
      <h2>GAME OVER</h2>
      <p class="sub-text">모든 구피가 세상을 떠났습니다.</p>
      <button id="btn-restart" class="pixel-btn primary">다시 시작</button>
    </div>
  </div>

  <script src="sound.js?v=14"></script>
  <script src="data.js?v=14"></script>
  <script src="guppy.js?v=14"></script>
  <script src="main.js?v=14"></script>
</body>
</html>
